<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickBite — Premium Food Delivery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      function updateQuickBiteFallback(message) {
        var fallback = document.querySelector('.app-fallback p')
        if (!fallback || document.documentElement.dataset.quickbite === 'mounted') return
        fallback.textContent = message
      }

      window.addEventListener('error', function (event) {
        updateQuickBiteFallback('QuickBite could not load the app script. Error: ' + (event.message || 'Script failed to load.'))
      })

      window.addEventListener('unhandledrejection', function (event) {
        updateQuickBiteFallback('QuickBite could not finish loading. Error: ' + (event.reason && event.reason.message ? event.reason.message : event.reason))
      })

      window.setTimeout(function () {
        updateQuickBiteFallback('QuickBite HTML loaded, but the Vue app script did not run. Please check that JavaScript is enabled and no browser extension, proxy, antivirus, or network filter is blocking /assets/*.js files.')
      }, 3500)
    </script>
    <style>
      .app-fallback {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Outfit, system-ui, sans-serif;
        color: #1a1a1a;
        background: #fafaf6;
        text-align: center;
      }
      .app-fallback h1 {
        margin: 0 0 12px;
        font-family: Fraunces, Georgia, serif;
        font-size: clamp(40px, 8vw, 76px);
        line-height: 1;
      }
      .app-fallback span {
        color: #ff5a1f;
      }
      .app-fallback p {
        max-width: 560px;
        margin: 0 auto 24px;
        color: #555;
        font-size: 18px;
      }
      .app-fallback a {
        display: inline-block;
        border-radius: 16px;
        background: #ff5a1f;
        color: white;
        padding: 14px 24px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-fallback">
        <main>
          <h1>Quick<span>Bite</span></h1>
          <p>Fresh meals delivered fast. If this screen stays visible, your browser is blocking the app script or the deployment has not finished loading.</p>
          <a href="https://quickbite-food-delivery-murex.vercel.app/">Reload QuickBite</a>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <noscript>
      <style>
        .app-fallback p::after {
          content: " JavaScript is disabled in this browser.";
          color: #b91c1c;
          font-weight: 700;
        }
      </style>
    </noscript>
  </body>
</html>
